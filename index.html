<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully suppress Vite dev server HMR WebSocket connection warnings in preview/proxy environments
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('wss://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('wss://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
    <title>Solara — Multi-Provider AI Chat</title>
    <meta name="description" content="Minimalist full-stack multi-provider AI chat supporting Gemini AI Studio, Groq, OpenRouter, NVIDIA NIM, Z.AI, custom OpenAI-compatible endpoints, thinking levels, and Tavily web search." />
    <meta property="og:title" content="Solara — Multi-Provider AI Chat" />
    <meta property="og:description" content="Minimalist full-stack multi-provider AI chat supporting Gemini AI Studio, Groq, OpenRouter, NVIDIA NIM, Z.AI, custom OpenAI-compatible endpoints, thinking levels, and Tavily web search." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  </head>
  <body class="bg-black text-zinc-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
